<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MakeAdClips OpenGraph / Twitter social card. Ink background, warm-bone
       text, signal-orange mark + accent, monospace technical metadata. -->
  <rect width="1200" height="630" fill="#0D0E10"/>

  <!-- Full-bleed faint crop-mark frame (brand motif) -->
  <g stroke="#292A2F" stroke-width="3" stroke-linecap="square">
    <path d="M56 108V56h52"/>
    <path d="M1144 108V56h-52"/>
    <path d="M56 522v52h52"/>
    <path d="M1144 522v52h-52"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(96, 250)">
    <rect width="110" height="110" rx="24" fill="#151619"/>
    <g stroke="#FF5A24" stroke-width="8" stroke-linecap="square">
      <path d="M24 36V24h12"/>
      <path d="M86 74v12H74"/>
    </g>
    <path d="M44 34 L80 55 L44 76 Z" fill="#FF5A24"/>
  </g>

  <!-- Wordmark -->
  <text x="236" y="300" font-family="Geist, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#F5F4EF">MakeAdClips</text>
  <text x="238" y="368" font-family="Geist, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="400" fill="#97989E">Turn one product photo into a <tspan fill="#FF6840" font-weight="600">professional video ad.</tspan></text>

  <!-- Monospace technical metadata strip -->
  <text x="98" y="470" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="4" fill="#6C6D70">PRODUCT / BRAND / CONCEPT / FILM &#183; 9:16 &#183; 16:9 &#183; OMNI FLASH</text>
</svg>
